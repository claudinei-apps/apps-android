plugins {
    id 'com.android.application'
}

// número de build vindo do GitHub (sobe a cada execução); fora do GitHub vale 1
def numeroBuild = System.getenv('GITHUB_RUN_NUMBER') ?: '1'
// versão do kit da PagBank. Existentes: 1.7.6 1.8.5 1.9.0 1.10.0 1.11.5 1.12.0 1.13.0 1.15.3 1.17.0
// 1.20.2 1.21.0 1.22.0 1.24.0 1.25.0 1.26.1 1.27.2 (1.27.2 exige "Terminal Service 1.4.0")
def kitPlugPag = '1.12.0'

android {
    namespace 'br.teste.android'
    compileSdk 34

    defaultConfig {
        applicationId 'br.claudinei.bingo_pos_a930'
        minSdk 21
        targetSdk 34
        // o celular aceita a atualização por cima só se o número subir
        versionCode Integer.parseInt(numeroBuild)
        versionName '2.0.' + numeroBuild + '-pp' + kitPlugPag
    }

    // chave de DEBUG fixa, commitada de propósito (não é segredo: só serve para testes)
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // gera o QR Code dentro do aparelho
    implementation 'com.google.zxing:core:3.3.3'
    // impressora da Moderninha Smart (PagBank)
    implementation "br.com.uol.pagseguro.plugpagservice.wrapper:wrapper:${kitPlugPag}"
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
