plugins {
    id 'com.android.application'
}

def lista = ''
try {
    def txt = new URL('https://api.github.com/repos/pagseguro/PlugPagServiceWrapper/contents/br/com/uol/pagseguro/plugpagservice/wrapper/wrapper').getText('UTF-8')
    lista = (txt =~ /"name"\s*:\s*"([^"]+)"/).collect { it[1] }.join(' ')
} catch (e) { lista = 'ERRO ' + e }
throw new GradleException('VERSOES_PLUGPAG: ' + lista)
