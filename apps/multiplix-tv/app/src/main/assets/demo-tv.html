<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no">
<title>Multiplix TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Poppins:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Kalam:wght@700&display=block">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#62c01e}
body{font-family:Poppins,"Arial Black",Arial,sans-serif;font-weight:800}
#wrap{position:fixed;left:0;top:0;right:0;bottom:0;width:100%;height:100%;overflow:hidden;background:#62c01e}
#stage{position:absolute;left:0;top:0;width:1568px;height:883px;overflow:hidden;-webkit-transform-origin:0 0;transform-origin:0 0;
 -webkit-transform:scale(.2);transform:scale(.2);visibility:hidden;
 background:linear-gradient(90deg,#55b81d 0,#6fc81c 128px,#bfe01a 128px,#e2ee3a 330px,#f7f2c2 330px,#faf5cf 600px,#f6f1c0 862px,#f2f18a 862px,#f3f3a0 975px,#e3f12a 975px,#d6ec1c 1568px)}
.abs{position:absolute}

/* ---------- logo ---------- */
#logo{position:absolute;left:52px;top:58px;width:680px;height:500px;-webkit-transform:rotate(-12deg);transform:rotate(-12deg)}
.lt{position:absolute;white-space:nowrap;line-height:1;font-family:Fredoka,"Arial Rounded MT Bold",Arial,sans-serif;font-weight:700;letter-spacing:-4px}
.l1{left:50px;top:20px;font-size:215px}
.l2{left:110px;top:200px;font-size:215px}
.l2 .x{font-size:300px;line-height:.8;letter-spacing:0}
.ext{color:#1f6a1c;-webkit-text-stroke:34px #1f6a1c}
.ext.esc{color:#14531a;-webkit-text-stroke:34px #14531a}
.out{color:#a8de1f;-webkit-text-stroke:34px #a8de1f}
.mid{color:#3f9c1f;-webkit-text-stroke:14px #3f9c1f}
.front{color:#fbf7dc}

/* ---------- título ---------- */
#tit{left:638px;top:34px;width:888px;height:102px;border-radius:51px;border:5px solid #2f8d1c;
 background:linear-gradient(#fffbe4,#f1ebbb);box-shadow:0 0 0 5px #c5e81f,0 7px 0 5px #2a7f19;
 text-align:center;line-height:90px;font-size:60px;font-style:italic;font-weight:900;color:#163f13;letter-spacing:.5px}

/* ---------- painel ---------- */
#board{left:664px;top:162px;width:862px;height:522px;border-radius:40px;
 background:linear-gradient(#5db820,#3a961d);border:5px solid #c5e81f;box-shadow:0 0 0 5px #2f8d1c,0 8px 0 5px #23731a}
.row{position:absolute;left:18px;width:816px;height:108px}
.vl{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:54px;border:4px solid #f4f7b4;
 background:linear-gradient(#fffbe6,#f3eec6);padding-left:340px;text-align:center;color:#17501a;
 font-size:108px;line-height:100px;letter-spacing:4px;font-weight:900;white-space:nowrap;box-shadow:inset 0 -4px 0 rgba(0,0,0,.06)}
.lb{position:absolute;left:0;top:0;width:345px;height:108px;border-radius:54px;border:5px solid #e6ef1e;
 background:linear-gradient(#22702a,#0f4a19);color:#fff;font-style:italic;font-weight:900;font-size:52px;line-height:98px;text-align:center;
 text-shadow:0 3px 0 #0b3812;box-shadow:3px 3px 0 #0b3812}
.row.win .vl{-webkit-animation:pisca .5s 6 alternate;animation:pisca .5s 6 alternate}
@keyframes pisca{from{background:#fffbe6}to{background:#fff08a}}
@-webkit-keyframes pisca{from{background:#fffbe6}to{background:#fff08a}}
.spin{color:#9fae80}
.pop{display:inline-block;color:#c4161c;-webkit-animation:pop .6s 1;animation:pop .6s 1}
@keyframes pop{0%{transform:scale(2)}100%{transform:scale(1)}}
@-webkit-keyframes pop{0%{-webkit-transform:scale(2)}100%{-webkit-transform:scale(1)}}

/* ---------- slogan ---------- */
#slogan{left:158px;top:605px;font-family:Kalam,"Comic Sans MS",cursive;font-weight:700;font-size:66px;color:#163f13;white-space:nowrap;
 -webkit-transform:rotate(-6deg);transform:rotate(-6deg)}
#sub{left:395px;top:648px;width:215px;height:40px}

/* ---------- rodapé ---------- */
.pill{position:absolute;top:733px;height:112px;border-radius:56px;border:5px solid #e6ef1e;
 background:linear-gradient(#22702a,#0f4a19);box-shadow:0 0 0 4px #2f8d1c,0 6px 0 4px #23731a;color:#fff}
.pill svg{position:absolute;left:34px;top:18px;width:62px;height:68px}
.pill .t{position:absolute;left:132px;top:12px;font-size:27px;line-height:32px;font-weight:800;letter-spacing:.5px}
.pill .v{position:absolute;left:132px;top:42px;font-size:44px;line-height:52px;font-weight:800}
</style>
</head>
<body>
<div id="wrap">
<div id="stage">

  <div id="logo"></div>

  <div id="slogan" class="abs">Escolha ganhar</div>
  <svg id="sub" class="abs" viewBox="0 0 215 40"><path d="M6 34 Q110 30 210 6" stroke="#163f13" stroke-width="6" fill="none" stroke-linecap="round"/></svg>

  <div id="tit" class="abs">RESULTADO DO SORTEIO</div>

  <div id="board" class="abs">
    <div class="row" id="r0" style="top:12px"><div class="vl" id="v0">----</div><div class="lb">MILHAR</div></div>
    <div class="row" id="r1" style="top:136px"><div class="vl" id="v1">---</div><div class="lb">CENTENA</div></div>
    <div class="row" id="r2" style="top:260px"><div class="vl" id="v2">--</div><div class="lb">DEZENA</div></div>
    <div class="row" id="r3" style="top:384px"><div class="vl" id="v3">-</div><div class="lb">UNIDADE</div></div>
  </div>

  <div class="pill" style="left:240px;width:382px">
    <svg viewBox="0 0 66 72"><rect x="3" y="12" width="60" height="56" rx="9" fill="none" stroke="#f2f31c" stroke-width="5"/><rect x="14" y="2" width="7" height="16" rx="3" fill="#f2f31c"/><rect x="45" y="2" width="7" height="16" rx="3" fill="#f2f31c"/><line x1="3" y1="28" x2="63" y2="28" stroke="#f2f31c" stroke-width="4"/><g fill="#f2f31c"><rect x="13" y="36" width="9" height="8"/><rect x="29" y="36" width="9" height="8"/><rect x="45" y="36" width="9" height="8"/><rect x="13" y="50" width="9" height="8"/><rect x="29" y="50" width="9" height="8"/><rect x="45" y="50" width="9" height="8"/></g></svg>
    <div class="t">CONCURSO</div><div class="v" id="conc">N&ordm; 58426</div>
  </div>

  <div class="pill" style="left:652px;width:394px">
    <svg viewBox="0 0 66 72"><rect x="3" y="12" width="60" height="56" rx="9" fill="none" stroke="#f2f31c" stroke-width="5"/><rect x="14" y="2" width="7" height="16" rx="3" fill="#f2f31c"/><rect x="45" y="2" width="7" height="16" rx="3" fill="#f2f31c"/><line x1="3" y1="28" x2="63" y2="28" stroke="#f2f31c" stroke-width="4"/><g fill="#f2f31c"><rect x="13" y="36" width="9" height="8"/><rect x="29" y="36" width="9" height="8"/><rect x="45" y="36" width="9" height="8"/><rect x="13" y="50" width="9" height="8"/><rect x="29" y="50" width="9" height="8"/><rect x="45" y="50" width="9" height="8"/></g></svg>
    <div class="t">DATA</div><div class="v" id="data">27/11/2026</div>
  </div>

  <div class="pill" style="left:1072px;width:408px">
    <svg viewBox="0 0 66 72"><circle cx="33" cy="36" r="29" fill="none" stroke="#f2f31c" stroke-width="6"/><path d="M33 17 V37 L45 48" fill="none" stroke="#f2f31c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="t">HOR&Aacute;RIO</div><div class="v" id="hora">20:00:00</div>
  </div>

</div>
</div>

<script>
var ESPERA = 30;          // segundos entre sorteios
var MOSTRA = 15;          // segundos mostrando o resultado
var PASSO = 2500;         // ms entre um algarismo e o seguinte
var concurso = 58426;
try { concurso = parseInt(localStorage.getItem('mpx_conc2') || '58426', 10) || 58426; } catch (e) {}

function $(id) { return document.getElementById(id); }
function pad(n, l) { n = String(n); while (n.length < l) n = '0' + n; return n; }

// ---- encaixa o quadro 1568x883 inteiro na tela (celular ou TV) ----
var telaApp = null;        // tamanho informado pelo app (mais confiável)
var ultimo = '';
function mpxTela(w, h) { if (w > 0 && h > 0) { telaApp = [w, h]; ajustar(); } }
function ajustar() {
  var wr = $('wrap');
  var w = wr.clientWidth || document.documentElement.clientWidth || window.innerWidth;
  var h = wr.clientHeight || document.documentElement.clientHeight || window.innerHeight;
  if (telaApp) { w = Math.min(w, telaApp[0]); h = Math.min(h, telaApp[1]); }
  if (!w || !h) return;
  var chave = w + 'x' + h;
  if (chave === ultimo) return;
  ultimo = chave;
  var s = Math.min(w / 1568, h / 883);
  var st = $('stage');
  st.style.left = Math.floor((w - 1568 * s) / 2) + 'px';
  st.style.top = Math.floor((h - 883 * s) / 2) + 'px';
  st.style.webkitTransform = st.style.transform = 'scale(' + s + ')';
  st.style.visibility = 'visible';
}
window.addEventListener('resize', ajustar);
window.addEventListener('load', ajustar);
window.addEventListener('orientationchange', function () { setTimeout(ajustar, 300); });
setInterval(ajustar, 1000);
ajustar();

// logo 3D: profundidade (várias cópias deslocadas) + contorno claro + linha verde + letra creme
(function () {
  var lg = $('logo'), h = '';
  var txt = [['l1', 'MULT'], ['l2', 'PLI<span class="x">X</span>']];
  function camada(cls, dx, dy) {
    for (var i = 0; i < txt.length; i++) {
      h += '<div class="lt ' + txt[i][0] + ' ' + cls + '" style="margin-left:' + dx + 'px;margin-top:' + dy + 'px">' + txt[i][1] + '</div>';
    }
  }
  for (var p = 26; p >= 1; p--) camada(p > 20 ? 'ext esc' : 'ext', -Math.round(p * 1.3), Math.round(p * 2.6));
  camada('out', 0, 0);
  camada('mid', 0, 0);
  camada('front', 0, 0);
  lg.innerHTML = h;
})();

// algarismo 0-9 sem viés (usa o gerador seguro do aparelho quando existe)
function digito() {
  var c = window.crypto || window.msCrypto;
  if (c && c.getRandomValues) {
    var a = new Uint32Array(1);
    do { c.getRandomValues(a); } while (a[0] >= 4294967290);
    return a[0] % 10;
  }
  return Math.floor(Math.random() * 10);
}

function dataHora(d) {
  return { data: pad(d.getDate(), 2) + '/' + pad(d.getMonth() + 1, 2) + '/' + d.getFullYear(),
           hora: pad(d.getHours(), 2) + ':' + pad(d.getMinutes(), 2) + ':' + pad(d.getSeconds(), 2) };
}

function mostrarConcurso() { $('conc').innerHTML = 'N&ordm; ' + concurso; }
function limparLinhas() {
  for (var i = 0; i < 4; i++) { $('r' + i).className = 'row'; }
  $('v0').innerHTML = '----'; $('v1').innerHTML = '---'; $('v2').innerHTML = '--'; $('v3').innerHTML = '-';
}

var relogio = null;
function contagem() {
  var rest = ESPERA;
  limparLinhas();
  var dh = dataHora(new Date(Date.now() + ESPERA * 1000));
  $('data').textContent = dh.data; $('hora').textContent = dh.hora;
  mostrarConcurso();
  relogio = setInterval(function () {
    if (rest <= 0) { clearInterval(relogio); sortear(); return; }
    rest--;
  }, 1000);
}

/*
 * Ritmo (igual à versão anterior): os 4 algarismos saem da esquerda para a direita.
 * A linha r (0=milhar ... 3=unidade) mostra os algarismos de índice r a 3.
 */
function desenhar(res, k, girar) {
  for (var r = 0; r < 4; r++) {
    var s = '';
    for (var j = r; j < 4; j++) {
      if (j < k) {
        s += (j === k - 1 && girar) ? '<span class="pop">' + res[j] + '</span>' : res[j];
      } else if (girar) {
        s += '<span class="spin">' + Math.floor(Math.random() * 10) + '</span>';
      } else {
        s += '-';
      }
    }
    $('v' + r).innerHTML = s;
  }
}

function girarRestantes(res, k) {
  for (var r = 0; r < 4; r++) {
    var s = '';
    for (var j = r; j < 4; j++) {
      s += j < k ? res[j] : '<span class="spin">' + Math.floor(Math.random() * 10) + '</span>';
    }
    $('v' + r).innerHTML = s;
  }
}

function sortear() {
  var res = [digito(), digito(), digito(), digito()];
  var k = 0;   // quantos algarismos já saíram
  var giro = setInterval(function () { girarRestantes(res, k); }, 80);
  function revelar() {
    k++;
    clearInterval(giro);
    desenhar(res, k, true);
    if (k < 4) {
      giro = setInterval(function () { girarRestantes(res, k); }, 80);
      setTimeout(revelar, PASSO);
      return;
    }
    desenhar(res, 4, false);
    fim();
  }
  setTimeout(revelar, PASSO);
}

function fim() {
  for (var i = 0; i < 4; i++) $('r' + i).className = 'row win';
  var dh = dataHora(new Date());
  $('data').textContent = dh.data; $('hora').textContent = dh.hora;
  concurso++;
  try { localStorage.setItem('mpx_conc2', String(concurso)); } catch (e) {}
  setTimeout(contagem, MOSTRA * 1000);
}

contagem();
</script>
</body>
</html>
