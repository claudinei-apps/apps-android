<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multiplix TV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#5fbf1f}
body{font-family:"Arial Rounded MT Bold",Arial,Helvetica,sans-serif;font-weight:900}
#stage{position:absolute;left:0;top:0;width:1568px;height:883px;overflow:hidden;-webkit-transform-origin:0 0;transform-origin:0 0;
 background:linear-gradient(90deg,#5fbf1f 0,#6cc61c 130px,#c9e61a 130px,#d4ea1c 330px,#f6f1bd 330px,#f8f3c6 865px,#f3f27a 865px,#e6f21d 975px,#dff01e 975px,#dcef1f 1568px)}
.abs{position:absolute}

/* ---------- logo ---------- */
#logo{position:absolute;left:40px;top:70px;width:660px;height:480px;-webkit-transform:rotate(-10deg);transform:rotate(-10deg)}
.lt{position:absolute;white-space:nowrap;line-height:1;letter-spacing:-2px}
.lt.back{color:#2f8a1e;-webkit-text-stroke:26px #8fd51f}
.lt.front{color:#fbf6d4;text-shadow:0 3px 0 #e8e2b0}
.l1{left:40px;top:10px;font-size:200px}
.l2{left:110px;top:190px;font-size:200px}
.l2 .x{font-size:270px}

/* ---------- título ---------- */
#tit{left:640px;top:35px;width:885px;height:100px;border-radius:50px;border:6px solid #2f8a1e;
 background:linear-gradient(#fdf9dc,#efe9b4);box-shadow:0 5px 0 #1e6b14;
 text-align:center;line-height:88px;font-size:58px;font-style:italic;color:#143d12;letter-spacing:1px}

/* ---------- painel ---------- */
#board{left:665px;top:160px;width:860px;height:525px;border-radius:40px;
 background:linear-gradient(#58b21f,#2f8a1e);border:6px solid #2d8a1c;box-shadow:0 5px 0 #1e6b14}
.row{position:absolute;left:20px;width:810px;height:108px}
.vl{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:54px;border:4px solid #f1f4a8;
 background:linear-gradient(#fffbe2,#f1ecc2);padding-left:330px;text-align:center;color:#145a14;
 font-size:104px;line-height:98px;letter-spacing:3px;font-weight:900;white-space:nowrap}
.lb{position:absolute;left:0;top:0;width:330px;height:108px;border-radius:54px;border:4px solid #e9ef1e;
 background:linear-gradient(#1f6a22,#0e4a16);color:#fff;font-style:italic;font-size:54px;line-height:98px;text-align:center;letter-spacing:0}
.row.win .vl{-webkit-animation:pisca .5s 6 alternate;animation:pisca .5s 6 alternate}
@keyframes pisca{from{background:#fffbe2}to{background:#fff08a}}
@-webkit-keyframes pisca{from{background:#fffbe2}to{background:#fff08a}}
.spin{color:#9aa97a}
.pop{display:inline-block;color:#c4161c;-webkit-animation:pop .6s 1;animation:pop .6s 1}
@keyframes pop{0%{transform:scale(2)}100%{transform:scale(1)}}
@-webkit-keyframes pop{0%{-webkit-transform:scale(2)}100%{-webkit-transform:scale(1)}}

/* ---------- slogan ---------- */
#slogan{left:160px;top:600px;font-size:62px;font-style:italic;color:#143d12;white-space:nowrap;font-weight:800;-webkit-transform:rotate(-4deg);transform:rotate(-4deg)}
#slogan b{font-weight:900}
#sub{left:400px;top:662px;width:210px;height:30px}

/* ---------- rodapé ---------- */
.pill{position:absolute;top:735px;height:110px;border-radius:55px;border:5px solid #e9ef1e;
 background:linear-gradient(#1f6a22,#0e4a16);box-shadow:0 4px 0 #0a3a10;color:#fff}
.pill svg{position:absolute;left:30px;top:15px;width:66px;height:72px}
.pill .t{position:absolute;left:125px;top:10px;font-size:29px;line-height:34px;letter-spacing:1px}
.pill .v{position:absolute;left:125px;top:40px;font-size:46px;line-height:52px}
</style>
</head>
<body>
<div id="stage">

  <div id="logo">
    <div class="lt back l1">MULT</div>
    <div class="lt back l2">PLI<span class="x">X</span></div>
    <div class="lt front l1">MULT</div>
    <div class="lt front l2">PLI<span class="x">X</span></div>
  </div>

  <div id="slogan" class="abs">Escolha <b>ganhar</b></div>
  <svg id="sub" class="abs" viewBox="0 0 210 30"><path d="M4 22 Q100 30 206 4" stroke="#143d12" stroke-width="5" fill="none" stroke-linecap="round"/></svg>

  <div id="tit" class="abs">RESULTADO DO SORTEIO</div>

  <div id="board" class="abs">
    <div class="row" id="r0" style="top:14px"><div class="vl" id="v0">----</div><div class="lb">MILHAR</div></div>
    <div class="row" id="r1" style="top:137px"><div class="vl" id="v1">---</div><div class="lb">CENTENA</div></div>
    <div class="row" id="r2" style="top:260px"><div class="vl" id="v2">--</div><div class="lb">DEZENA</div></div>
    <div class="row" id="r3" style="top:383px"><div class="vl" id="v3">-</div><div class="lb">UNIDADE</div></div>
  </div>

  <div class="pill" style="left:240px;width:380px">
    <svg viewBox="0 0 66 72"><rect x="3" y="12" width="60" height="56" rx="9" fill="none" stroke="#f2f31c" stroke-width="5"/><rect x="14" y="2" width="7" height="16" rx="3" fill="#f2f31c"/><rect x="45" y="2" width="7" height="16" rx="3" fill="#f2f31c"/><line x1="3" y1="28" x2="63" y2="28" stroke="#f2f31c" stroke-width="4"/><g fill="#f2f31c"><rect x="13" y="36" width="9" height="8"/><rect x="29" y="36" width="9" height="8"/><rect x="45" y="36" width="9" height="8"/><rect x="13" y="50" width="9" height="8"/><rect x="29" y="50" width="9" height="8"/><rect x="45" y="50" width="9" height="8"/></g></svg>
    <div class="t">CONCURSO</div><div class="v" id="conc">N&ordm; 58426</div>
  </div>

  <div class="pill" style="left:650px;width:395px">
    <svg viewBox="0 0 66 72"><rect x="3" y="12" width="60" height="56" rx="9" fill="none" stroke="#f2f31c" stroke-width="5"/><rect x="14" y="2" width="7" height="16" rx="3" fill="#f2f31c"/><rect x="45" y="2" width="7" height="16" rx="3" fill="#f2f31c"/><line x1="3" y1="28" x2="63" y2="28" stroke="#f2f31c" stroke-width="4"/><g fill="#f2f31c"><rect x="13" y="36" width="9" height="8"/><rect x="29" y="36" width="9" height="8"/><rect x="45" y="36" width="9" height="8"/><rect x="13" y="50" width="9" height="8"/><rect x="29" y="50" width="9" height="8"/><rect x="45" y="50" width="9" height="8"/></g></svg>
    <div class="t">DATA</div><div class="v" id="data">27/11/2026</div>
  </div>

  <div class="pill" style="left:1070px;width:410px">
    <svg viewBox="0 0 66 72"><circle cx="33" cy="36" r="30" fill="none" stroke="#f2f31c" stroke-width="6"/><path d="M33 16 V37 L46 49" fill="none" stroke="#f2f31c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="t">HOR&Aacute;RIO</div><div class="v" id="hora">20:00:00</div>
  </div>

</div>

<script>
var ESPERA = 30;          // segundos entre sorteios
var MOSTRA = 15;          // segundos mostrando o resultado
var PASSO = 2500;         // ms entre um algarismo e o seguinte
var concurso = 58426;
try { concurso = parseInt(localStorage.getItem('mpx_conc2') || '58426', 10) || 58426; } catch (e) {}

function $(id) { return document.getElementById(id); }
function pad(n, l) { n = String(n); while (n.length < l) n = '0' + n; return n; }

// ajusta o quadro 1568x883 a qualquer tela
function ajustar() {
  var w = window.innerWidth, h = window.innerHeight;
  var s = Math.min(w / 1568, h / 883);
  var st = $('stage');
  st.style.left = Math.round((w - 1568 * s) / 2) + 'px';
  st.style.top = Math.round((h - 883 * s) / 2) + 'px';
  st.style.webkitTransform = st.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', ajustar);
ajustar();

// algarismo 0-9 sem viés (usa o gerador seguro do aparelho quando existe)
function digito() {
  var c = window.crypto || window.msCrypto;
  if (c && c.getRandomValues) {
    var a = new Uint32Array(1);
    do { c.getRandomValues(a); } while (a[0] >= 4294967290);
    return a[0] % 10;
  }
  return Math.floor(Math.random() * 10);
}

function dataHora(d) {
  return { data: pad(d.getDate(), 2) + '/' + pad(d.getMonth() + 1, 2) + '/' + d.getFullYear(),
           hora: pad(d.getHours(), 2) + ':' + pad(d.getMinutes(), 2) + ':' + pad(d.getSeconds(), 2) };
}

function mostrarConcurso() { $('conc').innerHTML = 'N&ordm; ' + concurso; }
function limparLinhas() {
  for (var i = 0; i < 4; i++) { $('r' + i).className = 'row'; }
  $('v0').innerHTML = '----'; $('v1').innerHTML = '---'; $('v2').innerHTML = '--'; $('v3').innerHTML = '-';
}

var relogio = null;
function contagem() {
  var rest = ESPERA;
  limparLinhas();
  var prox = new Date(Date.now() + ESPERA * 1000);
  var dh = dataHora(prox);
  $('data').textContent = dh.data; $('hora').textContent = dh.hora;
  mostrarConcurso();
  relogio = setInterval(function () {
    if (rest <= 0) { clearInterval(relogio); sortear(); return; }
    rest--;
  }, 1000);
}

/*
 * Ritmo (igual à versão anterior): os 4 algarismos saem da esquerda para a direita.
 *  1º sai: MILHAR 1 _ _ _
 *  2º sai: MILHAR 1 8 _ _  | CENTENA 8 _ _
 *  3º sai: MILHAR 1 8 9 _  | CENTENA 8 9 _ | DEZENA 9 _
 *  4º sai: MILHAR 1 8 9 9  | CENTENA 8 9 9 | DEZENA 9 9 | UNIDADE 9
 * A linha r (0=milhar ... 3=unidade) mostra os algarismos de índice r a 3.
 */
function desenhar(res, k, girar) {
  for (var r = 0; r < 4; r++) {
    var s = '';
    for (var j = r; j < 4; j++) {
      if (j < k) {
        s += (j === k - 1 && girar) ? '<span class="pop">' + res[j] + '</span>' : res[j];
      } else if (girar) {
        s += '<span class="spin">' + Math.floor(Math.random() * 10) + '</span>';
      } else {
        s += '-';
      }
    }
    $('v' + r).innerHTML = s;
  }
}

function sortear() {
  var res = [digito(), digito(), digito(), digito()];
  var k = 0;   // quantos algarismos já saíram
  var giro = setInterval(function () {
    var atual = k;
    for (var r = 0; r < 4; r++) {
      var s = '';
      for (var j = r; j < 4; j++) {
        s += j < atual ? res[j] : '<span class="spin">' + Math.floor(Math.random() * 10) + '</span>';
      }
      $('v' + r).innerHTML = s;
    }
  }, 80);
  function revelar() {
    k++;
    clearInterval(giro);
    desenhar(res, k, true);
    if (k < 4) {
      giro = setInterval(function () {
        for (var r = 0; r < 4; r++) {
          var s = '';
          for (var j = r; j < 4; j++) {
            s += j < k ? res[j] : '<span class="spin">' + Math.floor(Math.random() * 10) + '</span>';
          }
          $('v' + r).innerHTML = s;
        }
      }, 80);
      setTimeout(revelar, PASSO);
      return;
    }
    desenhar(res, 4, false);
    fim(res.join(''));
  }
  setTimeout(revelar, PASSO);
}

function fim(m) {
  for (var i = 0; i < 4; i++) $('r' + i).className = 'row win';
  var dh = dataHora(new Date());
  $('data').textContent = dh.data; $('hora').textContent = dh.hora;
  concurso++;
  try { localStorage.setItem('mpx_conc2', String(concurso)); } catch (e) {}
  setTimeout(contagem, MOSTRA * 1000);
}

contagem();
</script>
</body>
</html>
