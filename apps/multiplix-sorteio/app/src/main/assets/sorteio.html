<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Multiplix Sorteio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Poppins:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Kalam:wght@700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#62c01e}
body{font-family:Poppins,"Arial Black",Arial,sans-serif;font-weight:800;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;background:#62c01e}
#stage{position:absolute;left:0;top:0;width:1568px;height:883px;overflow:hidden;-webkit-transform-origin:0 0;transform-origin:0 0;
 -webkit-transform:scale(.3);transform:scale(.3);
 background:linear-gradient(90deg,#55b81d 0,#6fc81c 128px,#bfe01a 128px,#e2ee3a 330px,#f7f2c2 330px,#faf5cf 600px,#f6f1c0 862px,#f2f18a 862px,#f3f3a0 975px,#e3f12a 975px,#d6ec1c 1568px)}
.abs{position:absolute}

/* ---------- logo ---------- */
#logo{position:absolute;left:52px;top:58px;width:680px;height:500px;-webkit-transform:rotate(-12deg);transform:rotate(-12deg)}
.lt{position:absolute;white-space:nowrap;line-height:1;font-family:Fredoka,"Arial Rounded MT Bold",Arial,sans-serif;font-weight:700;letter-spacing:-4px}
.l1{left:50px;top:20px;font-size:215px}
.l2{left:110px;top:200px;font-size:215px}
.l2 .x{font-size:300px;line-height:.8;letter-spacing:0}
.ext{color:#1f6a1c;-webkit-text-stroke:34px #1f6a1c}
.ext.esc{color:#14531a;-webkit-text-stroke:34px #14531a}
.out{color:#a8de1f;-webkit-text-stroke:34px #a8de1f}
.mid{color:#3f9c1f;-webkit-text-stroke:14px #3f9c1f}
.front{color:#fbf7dc}
#logo.agita{-webkit-animation:logoPula 1s ease-in-out infinite;animation:logoPula 1s ease-in-out infinite}
@-webkit-keyframes logoPula{0%,100%{-webkit-transform:rotate(-12deg) scale(1)}50%{-webkit-transform:rotate(-10deg) scale(1.04)}}
@keyframes logoPula{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(-10deg) scale(1.04)}}

/* ---------- título ---------- */
#tit{left:638px;top:34px;width:888px;height:102px;border-radius:51px;border:5px solid #2f8d1c;
 background:linear-gradient(#fffbe4,#f1ebbb);box-shadow:0 0 0 5px #c5e81f,0 7px 0 5px #2a7f19;
 text-align:center;line-height:90px;font-size:60px;font-style:italic;font-weight:900;color:#163f13;letter-spacing:.5px;white-space:nowrap;overflow:hidden}
#tit.cont{font-size:50px;color:#0f4a19}
#tit.sort{color:#c4161c;-webkit-animation:titPisca .6s ease-in-out infinite alternate;animation:titPisca .6s ease-in-out infinite alternate}
@-webkit-keyframes titPisca{from{background:#fffbe4}to{background:#fff27a}}
@keyframes titPisca{from{background:#fffbe4}to{background:#fff27a}}

/* ---------- painel ---------- */
#board{left:664px;top:162px;width:862px;height:522px;border-radius:40px;overflow:hidden;
 background:linear-gradient(#5db820,#3a961d);border:5px solid #c5e81f;box-shadow:0 0 0 5px #2f8d1c,0 8px 0 5px #23731a}
#brilho{position:absolute;top:-20px;left:-300px;width:200px;height:580px;z-index:5;pointer-events:none;opacity:0;
 background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));
 -webkit-transform:skewX(-20deg);transform:skewX(-20deg)}
#board.rolling #brilho{opacity:1;-webkit-animation:varre 1.1s linear infinite;animation:varre 1.1s linear infinite}
@-webkit-keyframes varre{from{left:-300px}to{left:1000px}}
@keyframes varre{from{left:-300px}to{left:1000px}}
#board.rolling{-webkit-animation:borda .35s linear infinite alternate;animation:borda .35s linear infinite alternate}
@-webkit-keyframes borda{from{border-color:#c5e81f}to{border-color:#fff35a}}
@keyframes borda{from{border-color:#c5e81f}to{border-color:#fff35a}}

.row{position:absolute;left:18px;width:816px;height:108px}
.vl{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:54px;border:4px solid #f4f7b4;
 background:linear-gradient(#fffbe6,#f3eec6);box-shadow:inset 0 -4px 0 rgba(0,0,0,.06)}
.lb{position:absolute;left:0;top:0;width:345px;height:108px;border-radius:54px;border:5px solid #e6ef1e;
 background:linear-gradient(#22702a,#0f4a19);color:#fff;font-style:italic;font-weight:900;font-size:52px;line-height:98px;text-align:center;
 text-shadow:0 3px 0 #0b3812;box-shadow:3px 3px 0 #0b3812}
.row.win .vl{-webkit-animation:pisca .45s 6 alternate;animation:pisca .45s 6 alternate}
.row.win .lb{-webkit-animation:lbPisca .45s 6 alternate;animation:lbPisca .45s 6 alternate}
@-webkit-keyframes pisca{from{background:#fffbe6}to{background:#fff08a}}
@keyframes pisca{from{background:#fffbe6}to{background:#fff08a}}
@-webkit-keyframes lbPisca{from{border-color:#e6ef1e}to{border-color:#ffffff}}
@keyframes lbPisca{from{border-color:#e6ef1e}to{border-color:#ffffff}}

/* ---------- roletas dos números ---------- */
.reels{position:absolute;left:345px;right:10px;top:4px;height:100px;text-align:center;white-space:nowrap;font-size:0}
.reel{display:inline-block;vertical-align:top;position:relative;width:84px;height:100px;overflow:hidden;
 font-size:104px;line-height:100px;font-weight:900;color:#17501a}
.reel .dash{display:none;position:absolute;left:0;top:0;width:100%;text-align:center;color:#8fa070}
.reel.idle .dash{display:block}
.reel.idle .strip{visibility:hidden}
.strip{position:absolute;left:0;top:0;width:100%}
.strip div{height:100px;text-align:center}
.reel.spin .strip{-webkit-animation:gira .25s linear infinite;animation:gira .25s linear infinite}
.reel.spin{color:#5f8a3c}
@-webkit-keyframes gira{from{-webkit-transform:translateY(0)}to{-webkit-transform:translateY(-1000px)}}
@keyframes gira{from{transform:translateY(0)}to{transform:translateY(-1000px)}}
.reel.roll:after{content:'';position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;
 background:linear-gradient(#f3eec6 0,rgba(250,246,214,0) 30%,rgba(250,246,214,0) 70%,#f3eec6 100%)}
.reel.lock{-webkit-animation:trava .8s ease-out;animation:trava .8s ease-out}
@-webkit-keyframes trava{0%{-webkit-transform:scale(1.55);color:#c4161c}45%{-webkit-transform:scale(.9);color:#c4161c}75%{-webkit-transform:scale(1.08)}100%{-webkit-transform:scale(1);color:#17501a}}
@keyframes trava{0%{transform:scale(1.55);color:#c4161c}45%{transform:scale(.9);color:#c4161c}75%{transform:scale(1.08)}100%{transform:scale(1);color:#17501a}}

/* ---------- slogan ---------- */
#slogan{left:158px;top:605px;font-family:Kalam,"Comic Sans MS",cursive;font-weight:700;font-size:66px;color:#163f13;white-space:nowrap;
 -webkit-transform:rotate(-6deg);transform:rotate(-6deg)}
#sub{left:395px;top:648px;width:215px;height:40px}

/* ---------- rodapé ---------- */
.pill{position:absolute;top:733px;height:112px;border-radius:56px;border:5px solid #e6ef1e;
 background:linear-gradient(#22702a,#0f4a19);box-shadow:0 0 0 4px #2f8d1c,0 6px 0 4px #23731a;color:#fff}
.pill svg{position:absolute;left:34px;top:18px;width:62px;height:68px}
.pill .t{position:absolute;left:132px;top:12px;font-size:27px;line-height:32px;font-weight:800;letter-spacing:.5px}
.pill .v{position:absolute;left:132px;top:42px;font-size:44px;line-height:52px;font-weight:800;white-space:nowrap}

/* ---------- barra do tempo ---------- */
#barra{position:absolute;left:240px;top:862px;width:1240px;height:12px;border-radius:6px;background:rgba(15,74,25,.25);overflow:hidden}
#barraIn{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#2f8d1c,#c5e81f)}

/* ---------- comemoração ---------- */
#festa{position:absolute;left:0;top:0;width:1568px;height:883px;z-index:20;opacity:0;visibility:hidden;overflow:hidden;
 -webkit-transition:opacity .4s,visibility .4s;transition:opacity .4s,visibility .4s;
 background:radial-gradient(circle at 50% 50%,rgba(20,90,30,.72),rgba(5,30,10,.92))}
#festa.on{opacity:1;visibility:visible}
#raios{position:absolute;left:-116px;top:-459px;width:1800px;height:1800px;opacity:.25;
 -webkit-animation:roda 10s linear infinite;animation:roda 10s linear infinite}
@-webkit-keyframes roda{from{-webkit-transform:rotate(0)}to{-webkit-transform:rotate(360deg)}}
@keyframes roda{from{transform:rotate(0)}to{transform:rotate(360deg)}}
#fbox{position:absolute;left:0;top:150px;width:1568px;text-align:center}
#festa.on #fbox{-webkit-animation:zoom .6s ease-out both;animation:zoom .6s ease-out both}
@-webkit-keyframes zoom{0%{-webkit-transform:scale(.2);opacity:0}70%{-webkit-transform:scale(1.08);opacity:1}100%{-webkit-transform:scale(1)}}
@keyframes zoom{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
#flab{display:inline-block;padding:0 56px;height:96px;line-height:86px;border-radius:48px;background:linear-gradient(#22702a,#0f4a19);
 border:5px solid #e6ef1e;color:#fff;font-style:italic;font-weight:900;font-size:56px;box-shadow:0 6px 0 #0b3812}
#fnum{font-size:310px;line-height:340px;font-weight:900;color:#fff35a;letter-spacing:12px;white-space:nowrap}
#fnum span{display:inline-block;
 text-shadow:0 0 0 #0f4a19,7px 7px 0 #0f4a19,-7px -7px 0 #0f4a19,7px -7px 0 #0f4a19,-7px 7px 0 #0f4a19,0 9px 0 #0f4a19,0 -9px 0 #0f4a19,9px 0 0 #0f4a19,-9px 0 0 #0f4a19,0 22px 0 #0b3812;
 -webkit-animation:entra .7s ease-out both;animation:entra .7s ease-out both}
@-webkit-keyframes entra{0%{-webkit-transform:translateY(-320px) scale(.3) rotate(-30deg);opacity:0}65%{-webkit-transform:translateY(24px) scale(1.18) rotate(6deg);opacity:1}100%{-webkit-transform:none;opacity:1}}
@keyframes entra{0%{transform:translateY(-320px) scale(.3) rotate(-30deg);opacity:0}65%{transform:translateY(24px) scale(1.18) rotate(6deg);opacity:1}100%{transform:none;opacity:1}}
#fcon{font-size:46px;color:#fffbe4;font-style:italic;font-weight:900;text-shadow:0 4px 0 #0b3812}
.cf{position:absolute;top:-40px;-webkit-animation:cai linear both;animation:cai linear both}
@-webkit-keyframes cai{from{-webkit-transform:translateY(0) rotate(0)}to{-webkit-transform:translateY(980px) rotate(900deg)}}
@keyframes cai{from{transform:translateY(0) rotate(0)}to{transform:translateY(980px) rotate(900deg)}}
</style>
</head>
<body>
<div id="wrap">
<div id="stage">

  <div id="logo"></div>

  <div id="slogan" class="abs">Escolha ganhar</div>
  <svg id="sub" class="abs" viewBox="0 0 215 40"><path d="M6 34 Q110 30 210 6" stroke="#163f13" stroke-width="6" fill="none" stroke-linecap="round"/></svg>

  <div id="tit" class="abs">RESULTADO DO SORTEIO</div>

  <div id="board" class="abs">
    <div class="row" id="r0" style="top:12px"><div class="vl"></div><div class="reels" id="k0"></div><div class="lb">MILHAR</div></div>
    <div class="row" id="r1" style="top:136px"><div class="vl"></div><div class="reels" id="k1"></div><div class="lb">CENTENA</div></div>
    <div class="row" id="r2" style="top:260px"><div class="vl"></div><div class="reels" id="k2"></div><div class="lb">DEZENA</div></div>
    <div class="row" id="r3" style="top:384px"><div class="vl"></div><div class="reels" id="k3"></div><div class="lb">UNIDADE</div></div>
    <div id="brilho"></div>
  </div>

  <div class="pill" style="left:240px;width:382px">
    <svg viewBox="0 0 66 72"><rect x="3" y="12" width="60" height="56" rx="9" fill="none" stroke="#f2f31c" stroke-width="5"/><rect x="14" y="2" width="7" height="16" rx="3" fill="#f2f31c"/><rect x="45" y="2" width="7" height="16" rx="3" fill="#f2f31c"/><line x1="3" y1="28" x2="63" y2="28" stroke="#f2f31c" stroke-width="4"/><g fill="#f2f31c"><rect x="13" y="36" width="9" height="8"/><rect x="29" y="36" width="9" height="8"/><rect x="45" y="36" width="9" height="8"/><rect x="13" y="50" width="9" height="8"/><rect x="29" y="50" width="9" height="8"/><rect x="45" y="50" width="9" height="8"/></g></svg>
    <div class="t">CONCURSO</div><div class="v" id="conc">N&ordm; 58426</div>
  </div>

  <div class="pill" style="left:652px;width:394px">
    <svg viewBox="0 0 66 72"><rect x="3" y="12" width="60" height="56" rx="9" fill="none" stroke="#f2f31c" stroke-width="5"/><rect x="14" y="2" width="7" height="16" rx="3" fill="#f2f31c"/><rect x="45" y="2" width="7" height="16" rx="3" fill="#f2f31c"/><line x1="3" y1="28" x2="63" y2="28" stroke="#f2f31c" stroke-width="4"/><g fill="#f2f31c"><rect x="13" y="36" width="9" height="8"/><rect x="29" y="36" width="9" height="8"/><rect x="45" y="36" width="9" height="8"/><rect x="13" y="50" width="9" height="8"/><rect x="29" y="50" width="9" height="8"/><rect x="45" y="50" width="9" height="8"/></g></svg>
    <div class="t">DATA</div><div class="v" id="data">--/--/----</div>
  </div>

  <div class="pill" style="left:1072px;width:408px">
    <svg viewBox="0 0 66 72"><circle cx="33" cy="36" r="29" fill="none" stroke="#f2f31c" stroke-width="6"/><path d="M33 17 V37 L45 48" fill="none" stroke="#f2f31c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="t">HOR&Aacute;RIO</div><div class="v" id="hora">--:--:--</div>
  </div>

  <div id="barra"><div id="barraIn"></div></div>

  <div id="festa">
    <svg id="raios" viewBox="-900 -900 1800 1800"></svg>
    <div id="conf"></div>
    <div id="fbox">
      <div id="flab">MILHAR SORTEADA</div>
      <div id="fnum"></div>
      <div id="fcon"></div>
    </div>
  </div>

</div>
</div>

<script>
var PERIODO = 30000;   // um sorteio a cada 30 segundos
var PRIMEIRO = 5000;   // primeiro sorteio 5 s depois de abrir
var H = 100;           // altura de cada algarismo na roleta
// [quando começa a frear (ms), quanto tempo leva freando (ms)] para cada algarismo, da esquerda p/ direita
var PLANO = [[1500, 1400], [3000, 1400], [4500, 1500], [6200, 2700]];
var FESTA_MS = 3600;

var concurso = 58425;
try { concurso = parseInt(localStorage.getItem('mpx_sorteio_conc') || '58425', 10) || 58425; } catch (e) {}

function $(id) { return document.getElementById(id); }
function pad(n, l) { n = String(n); while (n.length < l) n = '0' + n; return n; }

/* ---------- encaixa o quadro 1568x883 na tela ---------- */
var ultimo = '';
function ajustar() {
  var w = window.innerWidth || document.documentElement.clientWidth;
  var h = window.innerHeight || document.documentElement.clientHeight;
  if (!w || !h) return;
  var chave = w + 'x' + h;
  if (chave === ultimo) return;
  ultimo = chave;
  var s = Math.min(w / 1568, h / 883);
  var st = $('stage');
  st.style.left = Math.floor((w - 1568 * s) / 2) + 'px';
  st.style.top = Math.floor((h - 883 * s) / 2) + 'px';
  st.style.webkitTransform = st.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', ajustar);
window.addEventListener('load', ajustar);
setInterval(ajustar, 1000);
ajustar();

/* ---------- logo 3D ---------- */
(function () {
  var lg = $('logo'), h = '';
  var txt = [['l1', 'MULT'], ['l2', 'PLI<span class="x">X</span>']];
  function camada(cls, dx, dy) {
    for (var i = 0; i < txt.length; i++) {
      h += '<div class="lt ' + txt[i][0] + ' ' + cls + '" style="margin-left:' + dx + 'px;margin-top:' + dy + 'px">' + txt[i][1] + '</div>';
    }
  }
  for (var p = 26; p >= 1; p--) camada(p > 20 ? 'ext esc' : 'ext', -Math.round(p * 1.3), Math.round(p * 2.6));
  camada('out', 0, 0);
  camada('mid', 0, 0);
  camada('front', 0, 0);
  lg.innerHTML = h;
})();

/* ---------- raios da comemoração ---------- */
(function () {
  var s = '';
  for (var i = 0; i < 18; i++) {
    var a1 = (i * 20 - 5) * Math.PI / 180, a2 = (i * 20 + 5) * Math.PI / 180;
    s += '<polygon fill="#fff58a" points="0,0 ' + Math.round(Math.cos(a1) * 900) + ',' + Math.round(Math.sin(a1) * 900) + ' ' +
         Math.round(Math.cos(a2) * 900) + ',' + Math.round(Math.sin(a2) * 900) + '"/>';
  }
  $('raios').innerHTML = s;
})();

/* ---------- monta as roletas ---------- */
// reels[j] = todas as roletas que mostram o algarismo j (0=milhar ... 3=unidade)
var reels = [[], [], [], []];
(function () {
  for (var r = 0; r < 4; r++) {
    var box = $('k' + r);
    for (var j = r; j < 4; j++) {
      var d = document.createElement('div');
      d.className = 'reel idle';
      var s = '<div class="dash">-</div><div class="strip">';
      for (var i = 0; i < 30; i++) s += '<div>' + (i % 10) + '</div>';
      s += '</div>';
      d.innerHTML = s;
      box.appendChild(d);
      reels[j].push({ el: d, strip: d.lastChild, n: r * 4 + j });
    }
  }
})();

function setT(el, v) { el.style.webkitTransform = v; el.style.transform = v; }
function setTr(el, v) {
  if (v) { el.style.webkitTransition = '-webkit-transform ' + v; el.style.transition = 'transform ' + v; }
  else { el.style.webkitTransition = 'none'; el.style.transition = 'none'; }
}

function girar(o) {
  setTr(o.strip, null);
  setT(o.strip, '');
  var dur = (0.2 + (o.n % 3) * 0.04) + 's';
  o.strip.style.webkitAnimationDuration = dur;
  o.strip.style.animationDuration = dur;
  o.el.className = 'reel spin roll';
}

function parar(o, dig, ms) {
  setTr(o.strip, null);
  setT(o.strip, 'translateY(0px)');
  o.el.className = 'reel roll';
  void o.strip.offsetHeight;
  setTr(o.strip, ms + 'ms cubic-bezier(.1,.7,.25,1.03)');
  setT(o.strip, 'translateY(-' + ((20 + dig) * H) + 'px)');
  setTimeout(function () { o.el.className = 'reel lock'; }, ms);
}

/* ---------- som (gerado pelo próprio aparelho, sem arquivos) ---------- */
var AC = null;
function ac() {
  if (AC === null) {
    try { var C = window.AudioContext || window.webkitAudioContext; AC = C ? new C() : false; } catch (e) { AC = false; }
  }
  if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
  return AC || null;
}
function bip(f, dur, vol, tipo, quando) {
  var c = ac(); if (!c) return;
  try {
    var t = c.currentTime + (quando || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = tipo || 'square';
    o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
document.addEventListener('touchstart', ac);
document.addEventListener('click', ac);
var somGiro = null;
function tickLiga() { tickDesliga(); somGiro = setInterval(function () { bip(1300 + Math.random() * 500, 0.025, 0.035, 'square'); }, 75); }
function tickDesliga() { if (somGiro) clearInterval(somGiro); somGiro = null; }
function somTrava(j) { var b = 660 + j * 110; bip(b, 0.15, 0.14, 'triangle'); bip(b * 1.5, 0.25, 0.12, 'triangle', 0.07); }
function somFesta() {
  var n = [523, 659, 784, 1047, 784, 1047, 1319];
  for (var i = 0; i < n.length; i++) bip(n[i], 0.28, 0.13, 'triangle', i * 0.11);
  bip(523, 0.9, 0.08, 'triangle', 0.8); bip(659, 0.9, 0.08, 'triangle', 0.8); bip(1047, 0.9, 0.08, 'triangle', 0.8);
}

/* ---------- sorteio ---------- */
function digito() {
  var c = window.crypto || window.msCrypto;
  if (c && c.getRandomValues) {
    var a = new Uint32Array(1);
    do { c.getRandomValues(a); } while (a[0] >= 4294967290);
    return a[0] % 10;
  }
  return Math.floor(Math.random() * 10);
}

function mostrarData(d) {
  $('data').textContent = pad(d.getDate(), 2) + '/' + pad(d.getMonth() + 1, 2) + '/' + d.getFullYear();
  $('hora').textContent = pad(d.getHours(), 2) + ':' + pad(d.getMinutes(), 2) + ':' + pad(d.getSeconds(), 2);
}

var tituloAtual = '';
function titulo(txt, cls) {
  var k = txt + '|' + cls;
  if (k === tituloAtual) return;
  tituloAtual = k;
  var t = $('tit');
  t.textContent = txt;
  t.className = 'abs' + (cls ? ' ' + cls : '');
}

var sorteando = false, temResultado = false;
var inicioCiclo = Date.now(), proximo = inicioCiclo + PRIMEIRO;

function sortear() {
  sorteando = true;
  inicioCiclo = Date.now();
  proximo = inicioCiclo + PERIODO;
  concurso++;
  try { localStorage.setItem('mpx_sorteio_conc', String(concurso)); } catch (e) {}
  $('conc').innerHTML = 'N&ordm; ' + concurso;
  mostrarData(new Date());
  titulo('SORTEANDO...', 'sort');

  var res = [digito(), digito(), digito(), digito()];
  for (var r = 0; r < 4; r++) $('r' + r).className = 'row';
  $('board').className = 'abs rolling';
  $('logo').className = 'agita';
  for (var j = 0; j < 4; j++) for (var i = 0; i < reels[j].length; i++) girar(reels[j][i]);
  tickLiga();

  for (var k = 0; k < 4; k++) (function (j) {
    setTimeout(function () {
      for (var i = 0; i < reels[j].length; i++) parar(reels[j][i], res[j], PLANO[j][1]);
      setTimeout(function () { somTrava(j); }, PLANO[j][1]);
    }, PLANO[j][0]);
  })(k);

  setTimeout(function () { tickDesliga(); }, PLANO[3][0] + PLANO[3][1] - 300);
  setTimeout(function () { terminar(res); }, PLANO[3][0] + PLANO[3][1] + 400);
}

function terminar(res) {
  $('board').className = 'abs';
  $('logo').className = '';
  titulo('RESULTADO DO SORTEIO', '');
  festa(res);
  setTimeout(function () {
    for (var r = 0; r < 4; r++) (function (r) {
      setTimeout(function () { $('r' + r).className = 'row win'; }, r * 250);
    })(r);
    sorteando = false;
    temResultado = true;
  }, FESTA_MS);
}

function festa(res) {
  var s = '';
  for (var i = 0; i < 4; i++) {
    s += '<span style="-webkit-animation-delay:' + (0.25 + i * 0.15) + 's;animation-delay:' + (0.25 + i * 0.15) + 's">' + res[i] + '</span>';
  }
  $('fnum').innerHTML = s;
  $('fcon').innerHTML = 'CONCURSO N&ordm; ' + concurso;
  var cores = ['#fff35a', '#c5e81f', '#ffffff', '#ff5a5a', '#5ad1ff', '#ffb02e', '#3f9c1f'];
  var c = '';
  for (var k = 0; k < 90; k++) {
    var w = 12 + Math.floor(Math.random() * 14), h = 8 + Math.floor(Math.random() * 10);
    var dur = (2 + Math.random() * 1.6).toFixed(2), del = (Math.random() * 0.9).toFixed(2);
    c += '<div class="cf" style="left:' + Math.floor(Math.random() * 1560) + 'px;width:' + w + 'px;height:' + h + 'px;background:' +
         cores[k % cores.length] + ';-webkit-animation-duration:' + dur + 's;animation-duration:' + dur + 's;-webkit-animation-delay:' +
         del + 's;animation-delay:' + del + 's;border-radius:' + (k % 3 === 0 ? '50%' : '2px') + '"></div>';
  }
  $('conf').innerHTML = c;
  $('festa').className = 'on';
  somFesta();
  setTimeout(function () { $('festa').className = ''; }, FESTA_MS);
  setTimeout(function () { $('conf').innerHTML = ''; }, FESTA_MS + 600);
}

/* ---------- relógio / contagem ---------- */
function tique() {
  var agora = Date.now();
  var total = proximo - inicioCiclo;
  var p = total > 0 ? (agora - inicioCiclo) / total : 1;
  if (p < 0) p = 0; if (p > 1) p = 1;
  $('barraIn').style.width = (p * 100).toFixed(1) + '%';
  if (sorteando) return;
  var rest = proximo - agora;
  if (rest <= 0) { sortear(); return; }
  if (rest <= 10000 || !temResultado) titulo('PR\u00d3XIMO SORTEIO EM ' + pad(Math.ceil(rest / 1000), 2) + 's', 'cont');
  else titulo('RESULTADO DO SORTEIO', '');
}

$('conc').innerHTML = 'N&ordm; ' + (concurso + 1);
mostrarData(new Date(proximo));
setInterval(tique, 200);
tique();
</script>
