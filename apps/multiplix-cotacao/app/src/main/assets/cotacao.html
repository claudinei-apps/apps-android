<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Arial Black,Arial,sans-serif;background:linear-gradient(90deg,#5fc21e 0%,#c8e63a 40%,#fbf3c4 50%,#c8e63a 60%,#a6dc1a 100%);display:flex;align-items:center;justify-content:center;padding:3vmin;color:#fff}
.box{width:100%;max-width:520px;text-align:center}
.logo{font-size:15vmin;font-weight:900;line-height:.85;color:#fffbd0;text-shadow:0 1.2vmin 0 #0c5a1c,0 2vmin 0 #063d12;letter-spacing:-1px}
.logo b{color:#fffbd0}
.sub{font-style:italic;font-weight:900;color:#0c5a1c;font-size:5.5vmin;margin:2vmin 0 3vmin}
.painel{background:linear-gradient(#2fa22a,#0c5a1c);border:.8vmin solid #e8f21c;border-radius:4vmin;padding:2.5vmin;box-shadow:0 1vmin 2vmin rgba(0,0,0,.3)}
.cada{display:inline-block;background:linear-gradient(#e8362b,#a00d0d);border-radius:5vmin;padding:1vmin 6vmin;font-size:7vmin;margin-top:-6vmin;margin-bottom:2vmin;border:.5vmin solid #e8f21c}
.cada span{color:#ffe81a}
.l{display:flex;align-items:center;margin:1.6vmin 0;background:linear-gradient(#fff36a,#f7c600);border-radius:6vmin;border:.6vmin solid #e8f21c;overflow:hidden}
.n{flex:0 0 46%;background:linear-gradient(#146b22,#06330f);color:#fff;font-style:italic;font-size:5.5vmin;padding:2.4vmin 1vmin;border-radius:6vmin;border:.5vmin solid #e8f21c}
.v{flex:1;color:#8a0f0f;font-size:7vmin}
.rod{margin-top:3vmin;font-size:3.6vmin;color:#0c5a1c;font-family:Arial,sans-serif;font-weight:bold}
</style></head>
<body><div class="box">
<div class="logo">MULT<br>PLIX</div>
<div class="sub">Escolha ganhar</div>
<div class="painel">
<div class="cada">Cada <span>1,00</span></div>
<div class="l"><div class="n">MILHAR</div><div class="v">3.000,00</div></div>
<div class="l"><div class="n">CENTENA</div><div class="v">500,00</div></div>
<div class="l"><div class="n">DEZENA</div><div class="v">50,00</div></div>
<div class="l"><div class="n">UNIDADE</div><div class="v">5,00</div></div>
</div>
<div class="rod">Aposta mínima R$ 1,00</div>
</div></body></html>
