plugins {
    id 'com.android.application'
}

// número de build vindo do GitHub (sobe a cada execução); fora do GitHub vale 1
def numeroBuild = System.getenv('GITHUB_RUN_NUMBER') ?: '1'

android {
    namespace 'br.teste.android'
    compileSdk 34

    defaultConfig {
        applicationId 'br.teste.android'
        minSdk 21
        targetSdk 34
        // o celular aceita a atualização por cima só se o número subir
        versionCode Integer.parseInt(numeroBuild)
        versionName '1.0.' + numeroBuild
    }

    // chave de DEBUG fixa, commitada de propósito (não é segredo: só serve para testes)
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
