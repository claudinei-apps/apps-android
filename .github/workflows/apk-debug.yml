name: APK debug
run-name: APK ${{ inputs.app }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Nome da pasta do app dentro de apps/'
        required: true

# nada é permitido por padrão; cada job pede só o que precisa
permissions: {}

concurrency:
  group: apk-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP: ${{ inputs.app }}
    steps:
      - name: Conferir o nome do app
        run: |
          if ! printf '%s' "$APP" | grep -Eq '^[a-z][a-z0-9-]{1,29}$'; then echo "nome de app invalido"; exit 1; fi
      - uses: actions/checkout@v5
      - name: Conferir o nome do app (depois do checkout)
        run: test -f "apps/$APP/settings.gradle"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK debug
        working-directory: apps/${{ inputs.app }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: apps/${{ inputs.app }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

  publicar:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP: ${{ inputs.app }}
      GH_TOKEN: ${{ github.token }}
      NUMERO: ${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-debug
      - name: Publicar o APK (link de download sem login)
        run: |
          TAG="$APP-latest"
          ARQ="$APP-1.0.$NUMERO.apk"
          cp app-debug.apk "$ARQ"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$ARQ" --repo "$GITHUB_REPOSITORY" --title "$APP build $NUMERO" --notes "APK de teste (debug) do app $APP, build $NUMERO."
